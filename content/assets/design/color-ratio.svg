<svg width="400" height="90" viewBox="0 0 400 90" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="400" height="90" fill="none"/>
  <!-- Base (6 parts = 240px) -->
  <rect x="0" y="10" width="240" height="60" rx="4" fill="#f7f4ef" stroke="#c8c4bc" stroke-width="1.5"/>
  <text x="120" y="46" text-anchor="middle" font-size="14" fill="#48433e" font-weight="500" font-family="sans-serif">ベース　6</text>
  <!-- Main (3 parts = 120px) -->
  <rect x="244" y="10" width="110" height="60" rx="4" fill="#4a6a9e" stroke="#3a5a8e" stroke-width="1.5"/>
  <text x="299" y="46" text-anchor="middle" font-size="14" fill="white" font-weight="500" font-family="sans-serif">メイン　3</text>
  <!-- Accent (1 part = 40px) -->
  <rect x="358" y="10" width="42" height="60" rx="4" fill="#e07a5f" stroke="#c06a4f" stroke-width="1.5"/>
  <text x="379" y="46" text-anchor="middle" font-size="13" fill="white" font-weight="700" font-family="sans-serif">1</text>
  <!-- Label -->
  <text x="200" y="84" text-anchor="middle" font-size="11" fill="#b0a99e" font-family="sans-serif">ベース : メイン : アクセント = 6 : 3 : 1</text>
</svg>
