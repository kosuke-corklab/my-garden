  <rect x="0" y="0" width="380" height="175" rx="6" fill="#faf8f5" stroke="#e6e0d6" stroke-width="1"/>
  <!-- Title -->
  <text x="18" y="52" font-size="38" fill="#26211c" font-weight="700" font-family="sans-serif">タイトル</text>
  <rect x="250" y="28" width="118" height="24" rx="4" fill="#4a6a9e" opacity="0.12"/>
  <text x="258" y="45" font-size="11" fill="#4a6a9e" font-weight="600" font-family="sans-serif">太ゴシック・36pt</text>
  <!-- Heading -->
  <text x="18" y="96" font-size="22" fill="#26211c" font-weight="600" font-family="sans-serif">見出しのテキスト</text>
  <rect x="250" y="76" width="110" height="22" rx="4" fill="#4a6a9e" opacity="0.12"/>
